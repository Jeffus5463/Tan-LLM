name: tan-llm

services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.33.2}
    gpus: all
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - backend

  model-init:
    image: ollama/ollama:${OLLAMA_VERSION:-0.33.2}
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: ["pull", "${OLLAMA_MODEL:-qwen3.5:4b}"]
    restart: "no"
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    image: tan-llm-api:local
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_PATH: /data/tan-llm.db
      AUTH_USERNAME: "${AUTH_USERNAME:?Set AUTH_USERNAME in .env}"
      AUTH_PASSWORD_HASH: "${AUTH_PASSWORD_HASH:?Set AUTH_PASSWORD_HASH in .env}"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
    volumes:
      - app_data:/data
    depends_on:
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  app_data:
  ollama_data:
