name: tan-llm

services:
  ollama:
    image: ollama/ollama:0.33.2
    gpus: all
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - backend

  model-init:
    image: ollama/ollama:0.33.2
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: ["pull", "qwen3.5:4b"]
    restart: "no"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  ollama_data:
