name: tan-llm

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        NGINX_VERSION: "${NGINX_VERSION:-1.29-alpine}"
    image: tan-llm-web:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - name: local-web
        target: 80
        published: "3000"
        host_ip: 127.0.0.1
        protocol: tcp
      - name: lan-web
        target: 80
        published: "3000"
        host_ip: "${LAN_HOST_IP:-127.0.0.2}"
        protocol: tcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      backend:
        ipv4_address: "${WEB_PROXY_IP:-172.28.50.2}"

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.33.2}
    gpus: all
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - backend

  model-init:
    image: ollama/ollama:${OLLAMA_VERSION:-0.33.2}
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: ["pull", "${OLLAMA_MODEL:-qwen3.5:4b}"]
    restart: "no"
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    image: tan-llm-api:local
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3.5:4b}"
      OLLAMA_ALLOWED_MODELS: "${OLLAMA_ALLOWED_MODELS:-}"
      DATABASE_PATH: /data/tan-llm.db
      AUTH_USERNAME: "${AUTH_USERNAME:?Set AUTH_USERNAME in .env}"
      AUTH_PASSWORD_HASH: "${AUTH_PASSWORD_HASH:?Set AUTH_PASSWORD_HASH in .env}"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      ALLOW_LAN_HTTP: "${ALLOW_LAN_HTTP:-false}"
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-172.28.50.2}"
    volumes:
      - app_data:/data
      - type: bind
        source: ./backups
        target: /backups
    depends_on:
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: "${APP_NETWORK_SUBNET:-172.28.50.0/24}"
          ip_range: "${APP_DYNAMIC_IP_RANGE:-172.28.50.128/25}"

volumes:
  app_data:
  ollama_data:
